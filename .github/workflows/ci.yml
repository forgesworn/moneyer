name: CI

# lnurlcash-kit and lnurlcash-conformance come from npm now. CI used to check
# both out by name and build the kit from source, from when they were file:
# siblings; that shape outlived the reason for it and was quietly resolving
# both repositories through a GitHub redirect after the org move.

on:
  push:
    branches: [main, dev, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check

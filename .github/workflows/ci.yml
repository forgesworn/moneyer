name: CI

# moneyer links lnurlcash-kit and lnurlcash-conformance as file: siblings
# until they publish to npm, so CI checks them out by name and builds the
# kit first - the same shape a from-source clone follows (see README).

on:
  push:
    branches: [main, dev, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moneyer
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: moneyer

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: TheCryptoDonkey/lnurlcash-kit
          path: lnurlcash-kit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: TheCryptoDonkey/lnurlcash-conformance
          path: lnurlcash-conformance

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: moneyer/package-lock.json

      - name: build lnurlcash-kit (its dist is not committed)
        working-directory: lnurlcash-kit
        run: |
          npm ci
          npm run build

      - run: npm ci
      - run: npm run check
